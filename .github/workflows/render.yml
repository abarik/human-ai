name: Render and trigger server deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install system dependencies for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      # Kifejezetten megadjuk a repót (RSPM), hogy ne forráskódból, hanem gyors binárisként telepítse
      - name: Install R dependencies for Quarto
        run: |
          Rscript -e 'options(repos = c(CRAN = Sys.getenv("RSPM"))); install.packages(c("rmarkdown", "knitr"))'          

      - name: Render Quarto website
        run: |
          quarto render

      - name: Upload rendered site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: human-ai-site
          path: _site/
          retention-days: 7

      - name: Trigger deploy on psycho.unideb.hu
        run: |
          curl -fsS -X POST "https://psycho.unideb.hu/deploy-human-ai/deploy.php" \
            -H "Content-Type: application/json" \
            -H "X-Deploy-Token: ${{ secrets.PSYCHO_DEPLOY_WEBHOOK_SECRET }}" \
            -d '{"run_id": "${{ github.run_id }}"}'