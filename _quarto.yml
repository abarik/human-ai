format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    respect-user-color-scheme: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
        <script>
        (function () {
          var d = document.documentElement;
          if (!('IntersectionObserver' in window) || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          d.classList.add('emi-mozog');
          document.addEventListener('DOMContentLoaded', function () {
            var sel = '.emi-szakasz .emi-cimsor, .emi-szakasz .emi-bevezeto, .emi-teruletek li, .emi-blokkfej, a.emi-hir, a.emi-esemeny, .emi-sav .emi-cimsor, a.emi-szemely, .emi-sav .emi-bevezeto, .emi-event-card, main.content a.lightbox img, .quarto-listing .quarto-post, .quarto-listing tbody tr';
            var els = document.querySelectorAll(sel);
            var io = new IntersectionObserver(function (bej) {
              bej.forEach(function (b) {
                if (b.isIntersecting) { b.target.classList.add('emi-latszik'); io.unobserve(b.target); }
              });
            }, { rootMargin: '0px 0px -6% 0px', threshold: 0.1 });
            var h = window.innerHeight;
            els.forEach(function (el) {
              if (el.getBoundingClientRect().top < h) return;
              var i = Array.prototype.indexOf.call(el.parentNode.children, el);
              el.style.setProperty('--emi-i', Math.min(i, 5));
              el.classList.add('emi-felbukkan');
              io.observe(el);
            });
          });
        })();
        </script>
        <script>
        /* Menü: az aktuális oldal (és a szülő menüpont) kijelölése, morzsamenü a cím fölé */
        document.addEventListener('DOMContentLoaded', function () {
          var nav = document.querySelector('#quarto-header');
          if (!nav) return;
          var itt = decodeURIComponent(location.pathname).replace(/\/$/, '/index.html');
          var talalat = null, hossz = -1, pontos = false;
          nav.querySelectorAll('a.dropdown-item[href], a.nav-link[href]:not(.dropdown-toggle)').forEach(function (a) {
            var cel = decodeURIComponent(new URL(a.href, location.href).pathname).replace(/\/$/, '/index.html');
            var mappa = /\/index\.html$/.test(cel) ? null : cel.replace(/\.html$/, '/');
            if (cel === itt && cel.length > hossz) { talalat = a; hossz = cel.length; pontos = true; }
            else if (mappa && itt.indexOf(mappa) === 0 && mappa.length > hossz) { talalat = a; hossz = mappa.length; pontos = false; }
          });
          if (!talalat) return;
          talalat.classList.add('active');
          talalat.setAttribute('aria-current', pontos ? 'page' : 'true');
          var lenyilo = talalat.closest('.dropdown');
          var szulo = lenyilo ? lenyilo.querySelector('.dropdown-toggle') : null;
          if (szulo) { szulo.classList.add('active'); }
          if (!szulo && pontos) return;
          var fej = document.querySelector('#title-block-header .quarto-title') || document.querySelector('#title-block-header');
          if (!fej) return;
          var elemek = [];
          if (szulo) {
            elemek.push({ t: szulo.textContent.trim() });
            var li = talalat.closest('li'), elozo = li && li.previousElementSibling;
            while (elozo && !elozo.classList.contains('dropdown-header') && !elozo.querySelector('.dropdown-divider')) { elozo = elozo.previousElementSibling; }
            if (elozo && elozo.classList.contains('dropdown-header')) { elemek.push({ t: elozo.textContent.trim() }); }
          }
          elemek.push(pontos ? { t: talalat.textContent.trim(), most: true } : { t: talalat.textContent.trim(), h: talalat.href });
          var morzsa = document.createElement('nav');
          morzsa.className = 'emi-morzsa';
          morzsa.setAttribute('aria-label', 'Hol jársz az oldalon');
          var ol = document.createElement('ol');
          elemek.forEach(function (e) {
            var li = document.createElement('li');
            if (e.h) { var a = document.createElement('a'); a.href = e.h; a.textContent = e.t; li.appendChild(a); }
            else { li.textContent = e.t; if (e.most) li.setAttribute('aria-current', 'page'); }
            ol.appendChild(li);
          });
          morzsa.appendChild(ol);
          fej.insertBefore(morzsa, fej.firstChild);
        });
        </script>
        <script>
        /* Látogatottságmérés (GoatCounter és Cloudflare Web Analytics, süti nélkül) – csak az élő oldalon */
        if (location.hostname === 'human-ai.arts.unideb.hu') {
          var gc = document.createElement('script');
          gc.async = true;
          gc.src = 'https://gc.zgo.at/count.js';
          gc.setAttribute('data-goatcounter', 'https://human-ai.goatcounter.com/count');
          document.head.appendChild(gc);
          /* Cloudflare Web Analytics (süti nélkül) */
          var cf = document.createElement('script');
          cf.type = 'module';
          cf.src = 'https://static.cloudflareinsights.com/beacon.min.js';
          cf.setAttribute('data-cf-beacon', '{"token": "00ca91f01cab4772b98e5efa6aefb71c"}');
          document.head.appendChild(cf);
        }
        </script>
    css: styles.css
    toc: true
                
