<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <title>Ember–MI</title>
  <style>
    /* Betöltéskor a vonalak egymás után kirajzolódnak, a pont bepattan;
       utána a chip közepéből ritkán, lassan halvány hullámok indulnak, a fej alig biccent.
       Mozgáscsökkentésnél állókép. */
    .k { stroke: #4f7cb3; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none;
         stroke-dasharray: 100; stroke-dashoffset: 100; animation: rajz .8s cubic-bezier(.22,1,.36,1) forwards; }
    .r2 { animation-delay: .15s; } .r3 { animation-delay: .35s; } .r4 { animation-delay: .45s; } .r5 { animation-delay: .65s; }
    .pont { fill: #c08a2e; transform-origin: 36px 24px; transform: scale(0);
            animation: be .6s cubic-bezier(.34,1.56,.64,1) 1.25s forwards, lelegzik 9s ease-in-out 3s infinite; }
    .gy { fill: none; stroke: #c08a2e; stroke-width: 1.1; r: 3px; opacity: 0;
          animation: hullam 9s cubic-bezier(.2,.6,.3,1) 3s infinite; }
    .gy2 { animation-delay: 4.2s; }
    .fej { animation: biccent 9s ease-in-out 3s infinite; }
    @keyframes rajz { to { stroke-dashoffset: 0; } }
    @keyframes be { to { transform: scale(1); } }
    @keyframes lelegzik { 0%, 30%, 100% { transform: scale(1); } 12% { transform: scale(1.15); } }
    @keyframes hullam { 0% { r: 3px; opacity: .85; } 30% { r: 13px; opacity: 0; } 100% { r: 13px; opacity: 0; } }
    @keyframes biccent { 0%, 100% { transform: translateY(0); } 8% { transform: translateY(-1px); } 16% { transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .k, .fej, .pont, .gy { animation: none; }
      .k { stroke-dashoffset: 0; } .pont { transform: none; } .gy { display: none; }
    }
  </style>
  <g class="fej"><circle class="k" cx="12" cy="17" r="5" pathLength="100" transform="rotate(-90 12 17)"/></g>
  <path class="k r2" d="M3 35v-3a9 9 0 0 1 18 0v3" pathLength="100"/>
  <path class="k r3" d="M21 26h7" pathLength="100"/>
  <rect class="k r4" x="28" y="14" width="16" height="20" rx="4" pathLength="100"/>
  <path class="k r5" d="M33 10v4m6-4v4m-6 20v4m6-4v4m5-17h3m-3 6h3" pathLength="100"/>
  <circle class="gy" cx="36" cy="24" r="3"/>
  <circle class="gy gy2" cx="36" cy="24" r="3"/>
  <circle class="pont" cx="36" cy="24" r="3"/>
</svg>
